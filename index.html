<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7654d9"><title>🧠 치매 테스트 | 두뇌 챌린지</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#f2eaff,#fff4df);font-family:system-ui,'Noto Sans KR',sans-serif;color:#2d2447;min-height:100vh}main{max-width:480px;margin:auto;padding:25px 17px}.panel{background:white;border-radius:27px;padding:25px 21px;box-shadow:0 12px 38px #6b4ca322}h1{font-size:30px;margin:10px 0}h2{font-size:23px}p{line-height:1.65}.emoji{font-size:70px;text-align:center}.sub{color:#776e89}.btn{display:block;width:100%;border:0;background:#7751e5;color:white;border-radius:16px;padding:17px;font-size:18px;font-weight:800;margin-top:14px;cursor:pointer}.option{width:100%;display:block;text-align:left;padding:16px;border-radius:14px;border:2px solid #e8e0f4;background:#faf8ff;font-size:18px;margin:10px 0;color:#2d2447}.option:active{background:#dfd1ff}.progress{height:9px;border-radius:20px;background:#eee7f6;overflow:hidden}.progress div{height:100%;background:#7751e5}.chip{display:inline-block;background:#f1e9ff;border-radius:50px;padding:7px 13px;font-weight:700}.note{font-size:13px;color:#766f80}.score{font-size:65px;font-weight:900;color:#7751e5;text-align:center}input{font-size:18px;width:100%;border:2px solid #ddd0f6;border-radius:14px;padding:15px}footer{text-align:center;font-size:12px;color:#8a8094;padding:20px}</style></head><body><main><div class="panel" id="app"></div><footer>재미로 하는 인지기능 게임 · 의료 진단 아님</footer></main><script>
const questions=[{icon:"🧠",title:"기억 보물상자",prompt:"이 단어 5개를 기억해 두세요. 마지막에 다시 물어볼게요!",memory:true},{icon:"🔢",title:"숫자 탐험",prompt:"20에서 3을 세 번 빼면?",opts:["11","13","14","17"],a:0},{icon:"📅",title:"시간 탐정",prompt:"일주일은 며칠일까요?",opts:["5일","6일","7일","8일"],a:2},{icon:"🍎",title:"다른 친구 찾기",prompt:"다음 중 종류가 다른 하나는?",opts:["사과","배","바나나","자동차"],a:3},{icon:"🧩",title:"상황 판단",prompt:"약 복용 시간을 잊었다면 가장 적절한 행동은?",opts:["두 배로 먹기","약 봉투나 처방을 확인하고 필요시 약사에게 문의하기","아무 때나 먹기"],a:1},{icon:"✨",title:"규칙 찾기",prompt:"2, 4, 8, 16 다음 숫자는?",opts:["18","24","30","32"],a:3},{icon:"🕵️",title:"집중력 도전",prompt:"가, 나, 다, 라, 마 중 세 번째 글자는?",opts:["나","다","라","마"],a:1},{icon:"🎒",title:"기억 보물 찾기",prompt:"맨 처음 본 단어 5개를 기억나는 만큼 적어보세요.",recall:true}];
const words=["사과","기차","열쇠","바다","토끼"];let stage=-1,answers={},selected=-1;const app=document.getElementById("app");const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function show(){if(stage<0){app.innerHTML='<div class="emoji">🧠🎉</div><h1>치매 테스트!</h1><h2>내 두뇌는 얼마나 쌩쌩할까?</h2><p>친구들과 함께하는 8가지 두뇌 미션! 기억력과 집중력을 게임으로 확인해 보세요.</p><span class="chip">⏰ 약 5분</span> <span class="chip">🏆 점수 공유</span><button class="btn" onclick="start()">🎮 바로 시작하기</button><p class="note">본 게임은 재미를 위한 비표준 인지 활동입니다. 치매 진단이나 치매 확률을 제공하지 않습니다.</p>';return}if(stage===questions.length){result();return}const q=questions[stage];let body='<div class="progress"><div style="width:'+Math.round(stage/questions.length*100)+'%"></div></div><p class="sub">미션 '+(stage+1)+' / '+questions.length+'</p><div class="emoji">'+q.icon+'</div><h2>'+q.title+'</h2><p>'+q.prompt+'</p>';if(q.memory){body+='<div class="chip" style="display:block;text-align:center;line-height:2.6;font-size:21px">'+words.join(' · ')+'</div><button class="btn" onclick="next()">외웠어요! 다음 👉</button>'}else if(q.recall){body+='<input id="recall" placeholder="기억나는 단어를 띄어쓰기로 입력"><button class="btn" onclick="saveRecall()">🏆 결과 보기</button>'}else{q.opts.forEach((o,i)=>body+='<button class="option" onclick="pick('+i+')">'+(i+1)+'. '+esc(o)+'</button>')}app.innerHTML=body}function start(){stage=0;answers={};show()}function next(){stage++;show()}function pick(i){answers[stage]=i;next()}function saveRecall(){answers[stage]=document.getElementById("recall").value;next()}function result(){let correct=0;questions.forEach((q,i)=>{if(q.a!==undefined&&answers[i]===q.a)correct++});const tokens=String(answers[7]||"").split(/[\s,，、]+/);const remembered=words.filter(w=>tokens.includes(w)).length;const points=Math.round((correct+remembered/5)*100/7);const msg=points>=85?"두뇌 미션 고수! 🎉":points>=60?"좋은 도전이었어요! 🌟":"오늘은 조금 어려웠나요? 💜";app.innerHTML='<div class="emoji">🏆🧠</div><h1 style="text-align:center">두뇌 챌린지 완료!</h1><div class="score">'+points+'점</div><h2 style="text-align:center">'+msg+'</h2><p>🔢 퀴즈 정답: '+correct+'/6개<br>🎒 단어 기억: '+remembered+'/5개</p><p class="note">점수는 이 게임의 수행률을 100점으로 환산한 값입니다. 치매 발병 확률이나 인지기능 진단 결과가 아닙니다. 기억력 변화가 지속되거나 일상에 지장이 있다면 의료기관에서 표준화된 검사를 받으세요.</p><button class="btn" onclick="share('+points+')">📤 친구들에게 결과 공유</button><button class="btn" style="background:#e9e0f9;color:#543ba2" onclick="start()">🔁 다시 도전하기</button>'}async function share(n){const data={title:"🧠 치매 테스트",text:"내 두뇌 챌린지 점수는 "+n+"점! 🏆 여러분도 도전해 보세요! (재미용 게임, 치매 진단 아님)",url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(data.text+" "+data.url);alert("공유 문구를 복사했어요!")}}catch(e){}}show();
</script></body></html>
